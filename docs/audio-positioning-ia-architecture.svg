<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150" role="img" aria-labelledby="title desc">
  <title id="title">听声辨位地图节点 IA 架构</title>
  <desc id="desc">展示当前网页游戏以地图为基础、听声辨位为核心、AR 为辅助、节点范围触发任务与奖励的 IA 架构。</desc>
  <defs>
    <style>
      .bg { fill: #f7f2e8; }
      .title { font: 700 46px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #21302b; }
      .subtitle { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5d6964; }
      .section { fill: rgba(255,255,255,0.62); stroke: #d2c4af; stroke-width: 2; rx: 26; ry: 26; }
      .section-title { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #25332e; }
      .node { stroke-width: 2.5; rx: 17; ry: 17; }
      .node-title { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17231f; }
      .copy { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4d5b56; }
      .small { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5e6b66; }
      .tag { font: 700 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .home { fill: #f4d68f; stroke: #8b641a; }
      .map { fill: #c8e8d7; stroke: #2e7357; }
      .sound { fill: #ffd7bf; stroke: #b15f3b; }
      .ar { fill: #d9e6ff; stroke: #5177ad; }
      .task { fill: #efe0ff; stroke: #7655a6; }
      .reward { fill: #f8e8b8; stroke: #9b7830; }
      .dev { fill: #e5ece8; stroke: #60746b; }
      .system { fill: #ffffff; stroke: #82918a; }
      .arrow { fill: none; stroke: #364840; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #6d7a75; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrowSoft); }
      .arrow-strong { fill: none; stroke: #b15f3b; stroke-width: 4; marker-end: url(#arrowStrong); }
      .note-box { fill: #fffdf8; stroke: #d7c7ae; stroke-width: 1.7; rx: 14; ry: 14; }
      .note-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24312c; }
      .legend { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24312c; }
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#364840"/>
    </marker>
    <marker id="arrowSoft" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6d7a75"/>
    </marker>
    <marker id="arrowStrong" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b15f3b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1150"/>
  <circle cx="1400" cy="150" r="185" fill="#cde4d8" opacity="0.42"/>
  <circle cx="250" cy="980" r="190" fill="#f0dca7" opacity="0.38"/>
  <path d="M80 925 C330 790, 520 990, 760 855 C990 725, 1175 875, 1600 720" fill="none" stroke="#99c3bd" stroke-width="30" stroke-linecap="round" opacity="0.22"/>

  <text class="title" x="72" y="78">听声辨位地图节点 IA 架构</text>
  <text class="subtitle" x="74" y="118">地图是空间理解层，听声辨位是游客分流机制，AR 只是辅助校准</text>

  <!-- Developer layer -->
  <rect class="section" x="70" y="165" width="1560" height="170"/>
  <text class="section-title" x="105" y="207">0. 开发者配置层</text>

  <rect class="node dev" x="120" y="235" width="250" height="70"/>
  <text class="node-title" x="148" y="265">锚定任务节点</text>
  <text class="copy" x="148" y="291">坐标 / 名称 / 可见状态</text>

  <rect class="node dev" x="450" y="235" width="250" height="70"/>
  <text class="node-title" x="478" y="265">配置有效范围</text>
  <text class="copy" x="478" y="291">半径 / 多边形 / 触发区</text>

  <rect class="node dev" x="780" y="235" width="250" height="70"/>
  <text class="node-title" x="808" y="265">绑定节点任务</text>
  <text class="copy" x="808" y="291">任务条件 / 完成规则</text>

  <rect class="node dev" x="1110" y="235" width="250" height="70"/>
  <text class="node-title" x="1138" y="265">绑定奖励内容</text>
  <text class="copy" x="1138" y="291">明信片 / 成就 / 碎片</text>

  <path class="arrow" d="M370 270 L450 270"/>
  <path class="arrow" d="M700 270 L780 270"/>
  <path class="arrow" d="M1030 270 L1110 270"/>

  <rect class="note-box" x="1405" y="225" width="175" height="90"/>
  <text class="note-title" x="1430" y="255">输出给地图</text>
  <text class="small" x="1430" y="282">节点数据</text>
  <text class="small" x="1430" y="304">范围数据</text>

  <!-- User entry and main interface -->
  <rect class="section" x="70" y="380" width="1560" height="185"/>
  <text class="section-title" x="105" y="422">1. 用户入口与主界面</text>

  <rect class="node home" x="120" y="455" width="220" height="78"/>
  <text class="node-title" x="151" y="487">开始游戏</text>
  <text class="copy" x="151" y="513">从首页进入</text>

  <rect class="node system" x="430" y="440" width="320" height="108"/>
  <text class="node-title" x="462" y="474">主界面 / 旅程中控台</text>
  <text class="copy" x="462" y="501">显示当前位置、推荐节点</text>
  <text class="copy" x="462" y="526">主按钮：开始听声辨位</text>

  <rect class="node map" x="840" y="440" width="300" height="108"/>
  <text class="node-title" x="873" y="474">地图预览</text>
  <text class="copy" x="873" y="501">当前位置 + 节点范围</text>
  <text class="copy" x="873" y="526">查看完整地图</text>

  <rect class="node system" x="1230" y="440" width="300" height="108"/>
  <text class="node-title" x="1263" y="474">状态与快捷入口</text>
  <text class="copy" x="1263" y="501">角色 / 终端 / 明信片</text>
  <text class="copy" x="1263" y="526">节点任务 / 支线玩法</text>

  <path class="arrow" d="M340 494 L430 494"/>
  <path class="arrow" d="M750 494 L840 494"/>
  <path class="arrow-soft" d="M750 525 C905 610, 1120 608, 1230 525"/>

  <!-- Map layer -->
  <rect class="section" x="70" y="610" width="1560" height="220"/>
  <text class="section-title" x="105" y="652">2. 地图空间层</text>

  <rect class="node map" x="115" y="685" width="255" height="100"/>
  <text class="node-title" x="147" y="720">完整地图</text>
  <text class="copy" x="147" y="747">显示用户当前位置</text>
  <text class="copy" x="147" y="772">显示所有可见节点</text>

  <rect class="node map" x="450" y="685" width="255" height="100"/>
  <text class="node-title" x="482" y="720">节点范围</text>
  <text class="copy" x="482" y="747">开发者锚定范围</text>
  <text class="copy" x="482" y="772">未进入 / 接近 / 已进入</text>

  <rect class="node map" x="785" y="685" width="255" height="100"/>
  <text class="node-title" x="817" y="720">推荐目标节点</text>
  <text class="copy" x="817" y="747">最近 / 分流优先 / 任务状态</text>
  <text class="copy" x="817" y="772">可手动选择</text>

  <rect class="node sound" x="1120" y="685" width="300" height="100"/>
  <text class="node-title" x="1152" y="720">进入听声辨位</text>
  <text class="copy" x="1152" y="747">从地图目标发起</text>
  <text class="copy" x="1152" y="772">引导游客分流移动</text>

  <path class="arrow" d="M370 735 L450 735"/>
  <path class="arrow" d="M705 735 L785 735"/>
  <path class="arrow-strong" d="M1040 735 L1120 735"/>
  <path class="arrow-soft" d="M1490 315 C1545 410, 1540 615, 1420 700"/>

  <!-- Core mechanism -->
  <rect class="section" x="70" y="875" width="1560" height="205"/>
  <text class="section-title" x="105" y="917">3. 核心体验层：听声辨位 + AR 辅助 + 节点任务</text>

  <rect class="node sound" x="115" y="955" width="245" height="92"/>
  <text class="node-title" x="147" y="989">听声辨位</text>
  <text class="copy" x="147" y="1016">声音方向 / 强弱 / 距离</text>

  <rect class="node ar" x="430" y="955" width="245" height="92"/>
  <text class="node-title" x="462" y="989">AR 辅助校准</text>
  <text class="copy" x="462" y="1016">视觉提示跟随声音判断</text>

  <rect class="node task" x="745" y="955" width="245" height="92"/>
  <text class="node-title" x="777" y="989">进入节点范围</text>
  <text class="copy" x="777" y="1016">范围内解锁任务</text>

  <rect class="node task" x="1060" y="955" width="245" height="92"/>
  <text class="node-title" x="1092" y="989">完成节点任务</text>
  <text class="copy" x="1092" y="1016">拍照 / 互动 / 验证</text>

  <rect class="node reward" x="1375" y="955" width="205" height="92"/>
  <text class="node-title" x="1402" y="989">获得奖励</text>
  <text class="copy" x="1402" y="1016">明信片 / 成就</text>

  <path class="arrow-strong" d="M360 1001 L430 1001"/>
  <path class="arrow" d="M675 1001 L745 1001"/>
  <path class="arrow" d="M990 1001 L1060 1001"/>
  <path class="arrow" d="M1305 1001 L1375 1001"/>

  <rect class="note-box" x="103" y="1100" width="1495" height="34"/>
  <text class="legend" x="130" y="1123">关键约束：AR 不单独作为主玩法；奖励不绑定 AR 操作，而绑定“用户进入开发者锚定范围并完成该节点任务”。</text>
</svg>
