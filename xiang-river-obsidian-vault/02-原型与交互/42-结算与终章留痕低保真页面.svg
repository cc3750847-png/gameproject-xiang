<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">结算与终章留痕低保真页面</title>
  <desc id="desc">展示阶段结算、身份结局、旅程海报、权益复游等结算页面低保真结构。</desc>
  <defs>
    <style>
      .bg { fill: #f5f1e8; }
      .title { font: 700 46px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .subtitle { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #555; }
      .section { fill: rgba(255,255,255,0.62); stroke: #d2c5b2; stroke-width: 2; rx: 26; ry: 26; }
      .phone { fill: #fffdfa; stroke: #222; stroke-width: 4; rx: 34; ry: 34; }
      .h1 { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .label { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .small { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #555; }
      .tiny { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #666; }
      .box { fill: #f8f8f8; stroke: #333; stroke-width: 2; rx: 9; ry: 9; }
      .box2 { fill: #ffffff; stroke: #777; stroke-width: 1.6; rx: 9; ry: 9; }
      .poster { fill: #efefef; stroke: #222; stroke-width: 2.2; rx: 12; ry: 12; }
      .reward { fill: #fff8e8; stroke: #222; stroke-width: 2; rx: 10; ry: 10; }
      .locked { fill: #eeeeee; stroke: #777; stroke-width: 1.6; stroke-dasharray: 5 5; rx: 9; ry: 9; }
      .btn { fill: #222; stroke: #222; stroke-width: 2; rx: 12; ry: 12; }
      .btn2 { fill: #fff; stroke: #222; stroke-width: 2; rx: 12; ry: 12; }
      .btn-text { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #fff; }
      .btn-text2 { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .chip { fill: #222; rx: 12; ry: 12; }
      .chip2 { fill: #fff; stroke: #222; stroke-width: 1.6; rx: 12; ry: 12; }
      .chip-text { font: 700 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #fff; }
      .chip-text2 { font: 700 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .arrow { stroke: #222; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #666; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowSoft); }
      .flow { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .callout { fill: #fffdf8; stroke: #d2c2aa; stroke-width: 1.8; rx: 15; ry: 15; }
      .callout-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#222"/>
    </marker>
    <marker id="arrowSoft" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#666"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1320"/>
  <text class="title" x="70" y="76">结算与终章留痕低保真页面</text>
  <text class="subtitle" x="72" y="116">补充结算页：阶段结果、身份结局、旅程海报、权益复游；手机页内不放左上角页面名称</text>

  <rect class="section" x="50" y="155" width="1800" height="700"/>
  <text class="subtitle" x="82" y="195">结算主流程</text>

  <!-- Stage settlement -->
  <g transform="translate(95 245)">
    <rect class="phone" x="0" y="0" width="290" height="540"/>

    <text class="h1" x="56" y="62">湘江已记住你的回应</text>
    <text class="small" x="66" y="88">本阶段旅程完成</text>

    <rect class="poster" x="35" y="112" width="220" height="120"/>
    <path d="M62 199 C95 164, 135 180, 204 138" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="72" cy="196" r="8" fill="#222"/>
    <circle cx="140" cy="176" r="8" fill="#222"/>
    <circle cx="203" cy="140" r="8" fill="#222"/>
    <text class="tiny" x="84" y="222">路线留痕预览</text>

    <rect class="box" x="35" y="252" width="220" height="74"/>
    <text class="label" x="55" y="281">完成节点 3 / 8</text>
    <text class="tiny" x="55" y="304">觉醒 · 挥毫 · 拱极守望</text>

    <rect class="reward" x="35" y="342" width="104" height="58"/>
    <text class="label" x="56" y="370">明信片</text>
    <text class="tiny" x="57" y="389">x1</text>
    <rect class="reward" x="151" y="342" width="104" height="58"/>
    <text class="label" x="173" y="370">徽记</text>
    <text class="tiny" x="174" y="389">x1</text>

    <rect class="btn" x="45" y="426" width="200" height="38"/>
    <text class="btn-text" x="96" y="450">生成纪念</text>
    <rect class="btn2" x="45" y="476" width="200" height="30"/>
    <text class="btn-text2" x="96" y="496">查看详情</text>
  </g>

  <!-- Identity ending -->
  <g transform="translate(500 245)">
    <rect class="phone" x="0" y="0" width="290" height="540"/>

    <text class="h1" x="82" y="62">身份结局</text>
    <rect class="chip" x="102" y="82" width="86" height="24"/>
    <text class="chip-text" x="121" y="99">镇江者</text>

    <rect class="poster" x="35" y="120" width="220" height="132"/>
    <circle cx="145" cy="174" r="42" fill="none" stroke="#222" stroke-width="3"/>
    <path d="M106 178 L184 178" stroke="#222" stroke-width="4"/>
    <path d="M145 134 L145 216" stroke="#222" stroke-width="4"/>
    <text class="tiny" x="93" y="236">身份主视觉占位</text>

    <rect class="box" x="35" y="274" width="220" height="78"/>
    <text class="label" x="72" y="303">《定海安澜》</text>
    <text class="tiny" x="55" y="328">你平定风浪，守住江心回响</text>

    <rect class="box2" x="35" y="368" width="220" height="72"/>
    <text class="label" x="55" y="396">结局依据</text>
    <text class="tiny" x="55" y="418">投石镇江完成 · 定力加成</text>

    <rect class="btn" x="45" y="462" width="200" height="38"/>
    <text class="btn-text" x="91" y="486">生成海报</text>
  </g>

  <!-- Share poster -->
  <g transform="translate(905 245)">
    <rect class="phone" x="0" y="0" width="290" height="540"/>

    <text class="h1" x="82" y="62">旅程海报</text>
    <rect class="poster" x="45" y="92" width="200" height="300"/>
    <rect class="box2" x="68" y="118" width="154" height="44"/>
    <text class="label" x="100" y="145">湘江留痕</text>
    <path d="M78 308 C110 246, 154 268, 211 188" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="88" cy="302" r="7" fill="#222"/>
    <circle cx="146" cy="266" r="7" fill="#222"/>
    <circle cx="205" cy="196" r="7" fill="#222"/>
    <rect class="chip2" x="83" y="336" width="124" height="24"/>
    <text class="chip-text2" x="101" y="353">镇江者结局</text>
    <text class="tiny" x="88" y="379">二维码 / 分享码占位</text>

    <rect class="btn" x="45" y="422" width="94" height="36"/>
    <text class="btn-text" x="72" y="445">分享</text>
    <rect class="btn2" x="151" y="422" width="94" height="36"/>
    <text class="btn-text2" x="178" y="445">保存</text>
    <rect class="btn2" x="45" y="474" width="200" height="30"/>
    <text class="btn-text2" x="94" y="494">返回结算</text>
  </g>

  <!-- Benefits and replay -->
  <g transform="translate(1310 245)">
    <rect class="phone" x="0" y="0" width="290" height="540"/>

    <text class="h1" x="82" y="62">后续去向</text>

    <rect class="reward" x="35" y="98" width="220" height="70"/>
    <text class="label" x="55" y="126">专属礼遇</text>
    <text class="tiny" x="55" y="149">纪念章 / 文创兑换 / 非遗馆权益</text>

    <rect class="box2" x="35" y="188" width="220" height="76"/>
    <text class="label" x="55" y="216">未开放节点</text>
    <text class="tiny" x="55" y="239">朱张、天问、百工、百虹、鼓瑟</text>
    <text class="tiny" x="55" y="256">后续可继续解锁</text>

    <rect class="locked" x="35" y="284" width="220" height="48"/>
    <text class="label" x="55" y="314">复游提示</text>
    <text class="tiny" x="152" y="314">5 个待开启</text>

    <rect class="box" x="35" y="352" width="220" height="58"/>
    <text class="label" x="55" y="380">切换身份再体验</text>
    <text class="tiny" x="55" y="399">拾遗者 / 燃火者结局待解锁</text>

    <rect class="btn" x="45" y="436" width="200" height="38"/>
    <text class="btn-text" x="91" y="460">查看礼遇</text>
    <rect class="btn2" x="45" y="486" width="200" height="30"/>
    <text class="btn-text2" x="96" y="506">回到地图</text>
  </g>

  <path class="arrow" d="M385 515 L500 515"/>
  <text class="flow" x="407" y="492">查看身份结局</text>
  <path class="arrow" d="M790 515 L905 515"/>
  <text class="flow" x="812" y="492">生成海报</text>
  <path class="arrow" d="M1195 515 L1310 515"/>
  <text class="flow" x="1217" y="492">权益/复游</text>

  <rect class="section" x="50" y="900" width="1800" height="300"/>
  <text class="subtitle" x="82" y="940">结算页信息规则</text>

  <g transform="translate(95 985)">
    <rect class="callout" x="0" y="0" width="405" height="150"/>
    <text class="callout-title" x="28" y="42">阶段结算</text>
    <text class="small" x="28" y="78">适合当前 3 个开放节点版本。</text>
    <text class="small" x="28" y="108">展示完成节点、获得奖励和下一步。</text>
  </g>

  <g transform="translate(545 985)">
    <rect class="callout" x="0" y="0" width="405" height="150"/>
    <text class="callout-title" x="28" y="42">身份结局</text>
    <text class="small" x="28" y="78">镇江者：《定海安澜》。</text>
    <text class="small" x="28" y="108">拾遗者、燃火者作为后续结局入口。</text>
  </g>

  <g transform="translate(995 985)">
    <rect class="callout" x="0" y="0" width="405" height="150"/>
    <text class="callout-title" x="28" y="42">分享留存</text>
    <text class="small" x="28" y="78">海报优先于权益展示。</text>
    <text class="small" x="28" y="108">分享、保存、二维码或分享码预留。</text>
  </g>

  <g transform="translate(1445 985)">
    <rect class="callout" x="0" y="0" width="330" height="150"/>
    <text class="callout-title" x="28" y="42">运营入口</text>
    <text class="small" x="28" y="78">礼遇、兑换、复游提示。</text>
    <text class="small" x="28" y="108">不要压过纪念内容。</text>
  </g>

  <rect class="callout" x="70" y="1240" width="1760" height="48"/>
  <text class="callout-title" x="100" y="1271">结论：结算页先给玩家“完成感和留痕感”，再展示身份结局、分享海报和权益复游入口。</text>
</svg>
