<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">当前网页游戏 IA 总图</title>
  <desc id="desc">展示首页、地图分流、节点任务、主线旅程、AR 引导、角色终端与支线小游戏之间的关系。</desc>
  <defs>
    <style>
      .bg { fill: #f7f2e8; }
      .title { font: 700 44px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #24322d; }
      .subtitle { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5d6c66; }
      .section-title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #26342f; }
      .node-title { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17231f; }
      .node-copy { font: 400 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #465852; }
      .small { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5a6964; }
      .pill-text { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .card { stroke-width: 2.5; rx: 18; ry: 18; filter: url(#shadow); }
      .home { fill: #f5d48b; stroke: #9b6c18; }
      .map { fill: #bfe3d1; stroke: #34745a; }
      .task { fill: #d7e9ff; stroke: #4e79a7; }
      .journey { fill: #ffd2c2; stroke: #b65d3d; }
      .system { fill: #e5d9fb; stroke: #7254a3; }
      .side { fill: #d6efe9; stroke: #368576; }
      .ar { fill: #202f38; stroke: #2f8fa3; }
      .ar-text { fill: #f3fbff; }
      .band { fill: rgba(255,255,255,0.58); stroke: #d8cdbd; stroke-width: 1.5; rx: 24; ry: 24; }
      .arrow { fill: none; stroke: #44564f; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #6f8078; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrowSoft); }
      .label-box { fill: #ffffff; stroke: #d7c8b3; stroke-width: 1; rx: 11; ry: 11; }
      .label { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475851; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#6f6250" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#44564f"/>
    </marker>
    <marker id="arrowSoft" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6f8078"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <circle cx="1320" cy="150" r="170" fill="#d8eadf" opacity="0.45"/>
  <circle cx="235" cy="880" r="190" fill="#f2dfb0" opacity="0.42"/>
  <path d="M70 840 C310 740, 455 905, 700 790 C950 672, 1100 810, 1490 690" fill="none" stroke="#9dc7c0" stroke-width="28" stroke-linecap="round" opacity="0.26"/>

  <text class="title" x="80" y="82">当前网页游戏 IA 总图</text>
  <text class="subtitle" x="82" y="122">双轴结构：主线阶段负责叙事推进，页面视图负责功能分流</text>

  <rect class="band" x="60" y="170" width="1480" height="255"/>
  <text class="section-title" x="92" y="214">A. 顶层入口与地图分流</text>

  <rect class="card home" x="100" y="250" width="220" height="110"/>
  <text class="node-title" x="130" y="295">首页</text>
  <text class="node-copy" x="130" y="326">开始 / 继续</text>
  <text class="node-copy" x="130" y="350">设置 / 成就</text>

  <rect class="card map" x="450" y="235" width="250" height="140"/>
  <text class="node-title" x="488" y="282">地图总览</text>
  <text class="node-copy" x="488" y="315">只回答：下一步去哪</text>
  <text class="small" x="488" y="344">节点探索 / 支线 / 主线</text>

  <rect class="card map" x="820" y="205" width="250" height="105"/>
  <text class="node-title" x="858" y="250">节点列表</text>
  <text class="node-copy" x="858" y="280">定位、距离、可进入</text>

  <rect class="card side" x="820" y="335" width="250" height="105"/>
  <text class="node-title" x="858" y="380">支线玩法</text>
  <text class="node-copy" x="858" y="410">投石镇江 iframe</text>

  <rect class="card system" x="1190" y="205" width="250" height="105"/>
  <text class="node-title" x="1228" y="250">角色档案</text>
  <text class="node-copy" x="1228" y="280">身份、等级、摘要</text>

  <rect class="card system" x="1190" y="335" width="250" height="105"/>
  <text class="node-title" x="1228" y="380">玩家终端</text>
  <text class="node-copy" x="1228" y="410">头像、成就、收藏</text>

  <path class="arrow" d="M320 305 L450 305"/>
  <path class="arrow" d="M700 285 L820 255"/>
  <path class="arrow" d="M700 330 L820 390"/>
  <path class="arrow-soft" d="M700 260 C875 130, 1050 135, 1190 240"/>
  <path class="arrow-soft" d="M700 355 C880 500, 1035 490, 1190 390"/>

  <rect class="band" x="60" y="470" width="1480" height="285"/>
  <text class="section-title" x="92" y="514">B. 节点任务与奖励</text>

  <rect class="card map" x="105" y="560" width="230" height="115"/>
  <text class="node-title" x="138" y="606">可达节点</text>
  <text class="node-copy" x="138" y="637">洲头渡口</text>
  <text class="small" x="138" y="662">远钟台 / 树湾回声</text>

  <rect class="card task" x="455" y="535" width="250" height="125"/>
  <text class="node-title" x="493" y="582">节点详情</text>
  <text class="node-copy" x="493" y="613">介绍、奖励预览</text>
  <text class="small" x="493" y="640">开始任务 / 跳过任务</text>

  <rect class="card task" x="825" y="535" width="250" height="125"/>
  <text class="node-title" x="863" y="582">拍照任务</text>
  <text class="node-copy" x="863" y="613">收集 3 处景物</text>
  <text class="small" x="863" y="640">任务进度独立呈现</text>

  <rect class="card task" x="1195" y="535" width="250" height="125"/>
  <text class="node-title" x="1233" y="582">明信片奖励</text>
  <text class="node-copy" x="1233" y="613">写入玩家收藏</text>
  <text class="small" x="1233" y="640">可返回地图或开 AR</text>

  <rect class="label-box" x="460" y="685" width="245" height="42"/>
  <text class="label" x="487" y="712">跳过后仍可继续主线</text>

  <path class="arrow" d="M335 617 L455 598"/>
  <path class="arrow" d="M705 598 L825 598"/>
  <path class="arrow" d="M1075 598 L1195 598"/>
  <path class="arrow-soft" d="M580 660 C555 705, 475 720, 340 650"/>

  <rect class="band" x="60" y="800" width="1480" height="190"/>
  <text class="section-title" x="92" y="844">C. 主线阶段与 AR / 小游戏联调</text>

  <rect class="card journey" x="105" y="875" width="170" height="70"/>
  <text class="node-title" x="139" y="918">guiding</text>

  <rect class="card journey" x="320" y="875" width="180" height="70"/>
  <text class="node-title" x="344" y="918">approaching</text>

  <rect class="card journey" x="545" y="875" width="180" height="70"/>
  <text class="node-title" x="576" y="918">resonance</text>

  <rect class="card journey" x="770" y="875" width="180" height="70"/>
  <text class="node-title" x="795" y="918">completion</text>

  <rect class="card journey" x="995" y="875" width="160" height="70"/>
  <text class="node-title" x="1031" y="918">handoff</text>

  <rect class="card journey" x="1200" y="875" width="160" height="70"/>
  <text class="node-title" x="1237" y="918">finale</text>

  <rect class="card ar" x="110" y="760" width="280" height="75"/>
  <text class="node-title ar-text" x="145" y="805">AR 引导浮层</text>
  <text class="small ar-text" x="145" y="826">摄像头 / 粒子 / 声强 / 调试</text>

  <rect x="520" y="760" width="430" height="75" rx="18" ry="18" fill="#ffffff" stroke="#cbbca7" stroke-width="2"/>
  <text class="node-title" x="550" y="803">阶段小游戏接口</text>
  <text class="small" x="550" y="825">river-sound / island-light / memory-resonance</text>

  <path class="arrow" d="M275 910 L320 910"/>
  <path class="arrow" d="M500 910 L545 910"/>
  <path class="arrow" d="M725 910 L770 910"/>
  <path class="arrow" d="M950 910 L995 910"/>
  <path class="arrow" d="M1155 910 L1200 910"/>
  <path class="arrow-soft" d="M250 835 L205 875"/>
  <path class="arrow-soft" d="M640 835 L635 875"/>
  <path class="arrow-soft" d="M760 835 L860 875"/>

  <rect x="105" y="965" width="1255" height="42" rx="12" ry="12" fill="#ffffff" stroke="#d7c8b3"/>
  <text class="small" x="130" y="992">最短体验路径：首页 → 地图总览 → 节点列表 → 节点详情 → 拍照任务 → 明信片 → AR 引导 → 主线阶段 → 最终结算</text>

  <rect x="1390" y="875" width="120" height="105" rx="16" ry="16" fill="#4a5d56"/>
  <text class="pill-text" x="1414" y="910">底部导航</text>
  <text class="small" x="1412" y="940" fill="#eef7f3">主页 / 地图</text>
  <text class="small" x="1412" y="965" fill="#eef7f3">角色 / 终端</text>
</svg>
