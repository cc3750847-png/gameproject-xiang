<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">听声辨位未知节点低保真页面 V2</title>
  <desc id="desc">展示节点和任务未知、靠近后由听声辨位提示，并区分重要节点特殊提示与普通节点弹窗提醒的低保真页面结构。</desc>
  <defs>
    <style>
      .bg { fill: #f5f1e8; }
      .title { font: 700 46px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .subtitle { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #555; }
      .section { fill: rgba(255,255,255,0.62); stroke: #d2c5b2; stroke-width: 2; rx: 26; ry: 26; }
      .phone { fill: #fffdfa; stroke: #222; stroke-width: 4; rx: 34; ry: 34; }
      .phone-title { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .label { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .small { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #555; }
      .tiny { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #666; }
      .box { fill: #f8f8f8; stroke: #333; stroke-width: 2; rx: 9; ry: 9; }
      .box2 { fill: #ffffff; stroke: #777; stroke-width: 1.6; rx: 9; ry: 9; }
      .map { fill: #e9eee8; stroke: #333; stroke-width: 2; rx: 12; ry: 12; }
      .modal { fill: #fffdfa; stroke: #222; stroke-width: 3; rx: 16; ry: 16; }
      .btn { fill: #222; stroke: #222; stroke-width: 2; rx: 12; ry: 12; }
      .btn2 { fill: #fff; stroke: #222; stroke-width: 2; rx: 12; ry: 12; }
      .btn-text { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #fff; }
      .btn-text2 { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .line { stroke: #333; stroke-width: 2; fill: none; }
      .dash { stroke: #555; stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
      .range { fill: rgba(34,34,34,0.05); stroke: #333; stroke-width: 2; stroke-dasharray: 6 5; }
      .unknown { fill: rgba(34,34,34,0.04); stroke: #777; stroke-width: 2; stroke-dasharray: 4 6; }
      .important { fill: rgba(34,34,34,0.11); stroke: #222; stroke-width: 4; }
      .arrow { stroke: #222; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #666; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowSoft); }
      .split { stroke: #222; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .flow { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
      .callout { fill: #fffdf8; stroke: #d2c2aa; stroke-width: 1.8; rx: 15; ry: 15; }
      .callout-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; }
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#222"/>
    </marker>
    <marker id="arrowSoft" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#666"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1320"/>
  <text class="title" x="70" y="76">听声辨位未知节点低保真页面 V2</text>
  <text class="subtitle" x="72" y="116">节点和任务默认未知；靠近后由听声辨位提示；重要节点特殊提示，普通节点弹窗提醒且可跳过</text>

  <rect class="section" x="50" y="155" width="1800" height="600"/>
  <text class="subtitle" x="82" y="195">主流程：从未知声源到节点识别</text>

  <!-- 1 Main hub -->
  <g transform="translate(85 235)">
    <rect class="phone" x="0" y="0" width="250" height="440"/>
    <text class="phone-title" x="28" y="43">主界面</text>
    <text class="tiny" x="28" y="68">不直接暴露具体任务</text>
    <rect class="box2" x="25" y="92" width="200" height="54"/>
    <text class="label" x="45" y="119">当前位置</text>
    <text class="tiny" x="45" y="138">橘子洲入口附近</text>

    <rect class="map" x="25" y="165" width="200" height="118"/>
    <circle cx="72" cy="236" r="7" fill="#222"/>
    <text class="tiny" x="43" y="263">你的位置</text>
    <circle class="unknown" cx="153" cy="210" r="32"/>
    <text class="tiny" x="118" y="181">未知回响区</text>
    <circle class="unknown" cx="105" cy="204" r="23"/>

    <rect class="box" x="25" y="302" width="200" height="54"/>
    <text class="label" x="45" y="328">附近有回响</text>
    <text class="tiny" x="45" y="347">靠近后才显示节点与任务</text>

    <rect class="btn" x="35" y="373" width="180" height="38"/>
    <text class="btn-text" x="75" y="397">开始听声辨位</text>
  </g>

  <!-- 2 Sound scan -->
  <g transform="translate(405 235)">
    <rect class="phone" x="0" y="0" width="250" height="440"/>
    <text class="phone-title" x="28" y="43">听声辨位</text>
    <text class="tiny" x="28" y="68">先听，再靠近未知节点</text>

    <rect class="box" x="25" y="92" width="200" height="54"/>
    <text class="label" x="45" y="119">未知声源</text>
    <text class="tiny" x="45" y="138">类型未识别 · 约 70m</text>

    <circle cx="125" cy="232" r="78" fill="#f1f1f1" stroke="#222" stroke-width="3"/>
    <line class="dash" x1="125" y1="154" x2="125" y2="310"/>
    <line class="dash" x1="47" y1="232" x2="203" y2="232"/>
    <path d="M125 232 L178 190" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    <text class="label" x="85" y="340">声音偏右前方</text>
    <text class="tiny" x="64" y="362">移动中持续更新方向与距离</text>

    <rect class="btn2" x="35" y="389" width="180" height="32"/>
    <text class="btn-text2" x="74" y="410">AR 辅助校准</text>
  </g>

  <!-- 3 Approach range -->
  <g transform="translate(725 235)">
    <rect class="phone" x="0" y="0" width="250" height="440"/>
    <text class="phone-title" x="28" y="43">靠近提示</text>
    <text class="tiny" x="28" y="68">进入节点感知范围</text>

    <rect class="map" x="25" y="92" width="200" height="180"/>
    <path class="dash" d="M62 230 C90 190, 124 188, 166 132"/>
    <circle cx="66" cy="232" r="7" fill="#222"/>
    <circle class="range" cx="166" cy="132" r="42"/>
    <circle cx="166" cy="132" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
    <text class="tiny" x="95" y="260">接近未知节点范围</text>

    <rect class="box" x="25" y="292" width="200" height="58"/>
    <text class="label" x="45" y="319">回响变清晰</text>
    <text class="tiny" x="45" y="338">即将识别节点类型</text>

    <rect class="btn" x="35" y="373" width="180" height="38"/>
    <text class="btn-text" x="74" y="397">继续靠近</text>
  </g>

  <!-- Decision -->
  <g transform="translate(1020 310)">
    <rect class="callout" x="0" y="0" width="190" height="160"/>
    <text class="callout-title" x="34" y="38">节点识别</text>
    <text class="small" x="34" y="72">靠近后才判断：</text>
    <text class="label" x="34" y="105">重要节点</text>
    <text class="label" x="34" y="134">普通节点</text>
  </g>

  <!-- 4 Important prompt -->
  <g transform="translate(1280 200)">
    <rect class="phone" x="0" y="0" width="250" height="440"/>
    <text class="phone-title" x="28" y="43">重要节点提示</text>
    <text class="tiny" x="28" y="68">特殊提示 / 强引导</text>

    <rect class="box" x="25" y="92" width="200" height="80"/>
    <text class="label" x="48" y="126">发现重要节点</text>
    <text class="small" x="48" y="151">投石镇江</text>

    <rect class="map" x="25" y="190" width="200" height="88"/>
    <circle class="important" cx="125" cy="234" r="34"/>
    <circle cx="125" cy="234" r="7" fill="#222"/>
    <text class="tiny" x="67" y="267">重要节点范围已显示</text>

    <rect class="box2" x="25" y="296" width="200" height="52"/>
    <text class="small" x="45" y="318">此处有关键任务</text>
    <text class="tiny" x="45" y="338">建议完成后继续旅程</text>

    <rect class="btn" x="35" y="365" width="180" height="38"/>
    <text class="btn-text" x="72" y="389">进入重要任务</text>
  </g>

  <!-- 5 Normal popup -->
  <g transform="translate(1280 650)">
    <rect class="phone" x="0" y="0" width="250" height="440"/>
    <text class="phone-title" x="28" y="43">普通节点弹窗</text>
    <text class="tiny" x="28" y="68">轻提示 / 可跳过</text>

    <rect class="map" x="25" y="92" width="200" height="205"/>
    <circle cx="80" cy="242" r="7" fill="#222"/>
    <circle class="range" cx="152" cy="160" r="36"/>
    <circle cx="152" cy="160" r="7" fill="#fff" stroke="#222" stroke-width="2"/>

    <rect class="modal" x="39" y="150" width="172" height="116"/>
    <text class="label" x="63" y="181">附近有普通节点</text>
    <text class="tiny" x="63" y="206">是否查看这个任务？</text>
    <rect class="btn" x="56" y="222" width="62" height="28"/>
    <text class="btn-text" x="73" y="241">查看</text>
    <rect class="btn2" x="132" y="222" width="62" height="28"/>
    <text class="btn-text2" x="149" y="241">跳过</text>

    <rect class="box2" x="25" y="319" width="200" height="52"/>
    <text class="small" x="45" y="341">普通节点不强制</text>
    <text class="tiny" x="45" y="361">跳过后继续听声辨位</text>
  </g>

  <path class="arrow" d="M335 455 L405 455"/>
  <path class="arrow" d="M655 455 L725 455"/>
  <path class="arrow" d="M975 455 L1020 390"/>
  <path class="split" d="M1210 372 C1240 330, 1245 300, 1280 300"/>
  <path class="split" d="M1210 410 C1240 560, 1240 760, 1280 820"/>
  <text class="flow" x="1046" y="288">进入范围后</text>
  <text class="flow" x="1046" y="307">才识别节点类型</text>

  <rect class="section" x="50" y="800" width="1110" height="410"/>
  <text class="subtitle" x="82" y="840">节点任务与奖励页面</text>

  <!-- Important task -->
  <g transform="translate(95 885)">
    <rect class="phone" x="0" y="0" width="250" height="275"/>
    <text class="phone-title" x="28" y="43">重要任务页</text>
    <rect class="box" x="25" y="70" width="200" height="58"/>
    <text class="label" x="45" y="96">投石镇江</text>
    <text class="tiny" x="45" y="115">重要节点任务</text>
    <rect class="box2" x="25" y="146" width="200" height="46"/>
    <text class="small" x="45" y="174">任务内容此时才公开</text>
    <rect class="btn" x="35" y="214" width="180" height="36"/>
    <text class="btn-text" x="74" y="237">开始任务</text>
  </g>

  <!-- Normal task -->
  <g transform="translate(405 885)">
    <rect class="phone" x="0" y="0" width="250" height="275"/>
    <text class="phone-title" x="28" y="43">普通任务页</text>
    <rect class="box" x="25" y="70" width="200" height="58"/>
    <text class="label" x="45" y="96">普通节点</text>
    <text class="tiny" x="45" y="115">靠近后弹窗进入</text>
    <rect class="box2" x="25" y="146" width="200" height="46"/>
    <text class="small" x="45" y="174">任务内容此时才公开</text>
    <rect class="btn" x="35" y="209" width="84" height="34"/>
    <text class="btn-text" x="63" y="231">完成</text>
    <rect class="btn2" x="134" y="209" width="84" height="34"/>
    <text class="btn-text2" x="161" y="231">跳过</text>
  </g>

  <!-- Reward -->
  <g transform="translate(715 885)">
    <rect class="phone" x="0" y="0" width="250" height="275"/>
    <text class="phone-title" x="28" y="43">奖励反馈</text>
    <rect class="box" x="25" y="74" width="200" height="92"/>
    <text class="label" x="62" y="112">获得节点奖励</text>
    <text class="small" x="58" y="140">明信片 / 成就 / 碎片</text>
    <rect class="btn" x="35" y="192" width="84" height="34"/>
    <text class="btn-text" x="61" y="214">地图</text>
    <rect class="btn2" x="134" y="192" width="84" height="34"/>
    <text class="btn-text2" x="155" y="214">继续听</text>
  </g>

  <path class="arrow-soft" d="M1280 410 C1010 760, 250 760, 220 885"/>
  <path class="arrow-soft" d="M1280 875 C1030 1040, 690 1040, 655 1018"/>
  <path class="arrow" d="M345 1025 L405 1025"/>
  <path class="arrow" d="M655 1025 L715 1025"/>

  <rect class="callout" x="1030" y="1010" width="780" height="125"/>
  <text class="callout-title" x="1060" y="1048">本版低保真规则</text>
  <text class="small" x="1060" y="1080">1. 地图只显示当前位置和未知回响区，不提前暴露所有任务详情。</text>
  <text class="small" x="1060" y="1106">2. 听声辨位靠近节点后才识别节点类型，并触发对应提示。</text>
  <text class="small" x="1060" y="1132">3. 重要节点特殊提示并强引导；普通节点只弹窗提醒，玩家可跳过。</text>

  <rect class="callout" x="70" y="1235" width="1760" height="46"/>
  <text class="callout-title" x="100" y="1265">结论：主体验不再是“先看节点任务再去做”，而是“先听声靠近未知节点，再由系统揭示节点类型和任务”。</text>
</svg>
